<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="View your saved wishlist items on AURA and quickly add them to your shopping cart.">
    <title>AURA | Wishlist</title>
    <!-- CSS Foundation & UI System -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- JavaScript Component & Page Hydration -->
    <script src="../js/components/navbar.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/data/products.js" defer></script>
    <script src="../js/cart/cart-service.js" defer></script>
    <script src="../js/wishlist/wishlist-service.js" defer></script>
    <script src="../js/auth/auth-service.js" defer></script>
    <script src="../js/pages/wishlist-page.js" defer></script>
</head>

<body>

    <!-- Sticky Header & Navigation -->
    <app-navbar></app-navbar>

    <main class="section"
        style="padding-top: var(--spacing-xl); background-color: var(--color-background); min-height: 80vh;">
        <div class="container">

            <!-- Breadcrumb Navigation -->
            <nav aria-label="Breadcrumb"
                style="margin-bottom: var(--spacing-lg); font-size: 0.875rem; color: var(--color-text-muted);">
                <a href="../index.html" style="color: var(--color-text-muted);">Home</a>
                <span style="margin-inline: 4px;">/</span>
                <span style="color: var(--color-primary); font-weight: 500;">Wishlist</span>
            </nav>

            <div class="section-header"
                style="text-align: left; margin-bottom: var(--spacing-xl); display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
                <div>
                    <h1 class="section-title" style="margin-bottom: 4px;">My Wishlist</h1>
                    <p class="section-subtitle" style="margin: 0;">Save products you love and review them anytime.</p>
                </div>
                <span id="wishlist-count-badge"
                    style="font-size: 0.95rem; font-weight: 600; color: var(--color-secondary);"></span>
            </div>

            <!-- Active Wishlist Grid Layout -->
            <div id="wishlist-content-container" style="display: none;">
                <div id="wishlist-grid" class="grid grid-4" style="gap: var(--spacing-lg);">
                    <!-- Wishlist cards populated dynamically -->
                </div>
            </div>

            <!-- Empty Wishlist Fallback View -->
            <div id="empty-wishlist-container" class="empty-state-container"
                style="display: none; max-width: 600px; margin: 40px auto;">
                <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                    </path>
                </svg>
                <h2 style="margin: 0 0 var(--spacing-xs); font-size: 1.6rem;">YOUR WISHLIST IS EMPTY</h2>
                <p style="margin: 0 0 var(--spacing-lg); color: var(--color-text-muted); font-size: 1rem;">
                    Save products you love and find them here later.
                </p>
                <a href="products.html" class="btn btn-primary btn-lg">EXPLORE PRODUCTS</a>
            </div>

        </div>
    </main>

    <!-- Professional Footer -->
    <app-footer></app-footer>

</body>

</html>
