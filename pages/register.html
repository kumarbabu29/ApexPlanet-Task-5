<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create a new AURA account to manage orders, wishlists, and enjoys seamless checkout.">
    <title>AURA | Register</title>
    <!-- CSS Foundation & UI System -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- JavaScript: Services load first so navbar badges initialise correctly -->
    <script src="../js/data/products.js" defer></script>
    <script src="../js/cart/cart-service.js" defer></script>
    <script src="../js/wishlist/wishlist-service.js" defer></script>
    <script src="../js/auth/auth-service.js" defer></script>
    <script src="../js/components/navbar.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/pages/register-page.js" defer></script>
</head>

<body>

    <!-- Sticky Header & Navigation -->
    <app-navbar></app-navbar>

    <main class="section"
        style="padding-top: var(--spacing-xl); background-color: var(--color-background); min-height: 80vh;">
        <div class="container">

            <div class="auth-card-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">Create Account</h1>
                        <p class="auth-subtitle">Join AURA for a personalized shopping experience.</p>
                    </div>

                    <!-- Top General Alert Box -->
                    <div id="form-alert" class="form-alert" style="display: none;"></div>

                    <form id="register-form" novalidate aria-label="Create Account Form">

                        <!-- Full Name Field -->
                        <div class="form-group">
                            <label for="name-input" class="form-label">Full Name</label>
                            <input type="text" id="name-input" class="form-input" placeholder="e.g. John Doe" required
                                aria-required="true">
                            <div id="name-error" class="form-error"></div>
                        </div>

                        <!-- Email Address Field -->
                        <div class="form-group">
                            <label for="email-input" class="form-label">Email Address</label>
                            <input type="email" id="email-input" class="form-input" placeholder="john@example.com"
                                required aria-required="true">
                            <div id="email-error" class="form-error"></div>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group">
                            <label for="password-input" class="form-label">Password</label>
                            <input type="password" id="password-input" class="form-input"
                                placeholder="Minimum 8 characters" required aria-required="true">
                            <div id="password-error" class="form-error"></div>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="form-group">
                            <label for="confirm-password-input" class="form-label">Confirm Password</label>
                            <input type="password" id="confirm-password-input" class="form-input"
                                placeholder="Re-enter your password" required aria-required="true">
                            <div id="confirm-error" class="form-error"></div>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="form-group" style="margin-bottom: var(--spacing-lg);">
                            <label class="form-checkbox-label">
                                <input type="checkbox" id="terms-checkbox" required>
                                <span>I agree to the <a href="#" style="color: var(--color-secondary);">Terms of
                                        Service</a> &amp; <a href="#" style="color: var(--color-secondary);">Privacy
                                        Policy</a></span>
                            </label>
                            <div id="terms-error" class="form-error"></div>
                        </div>

                        <!-- Submit CTA -->
                        <button type="submit" class="btn btn-primary btn-lg btn-full">CREATE ACCOUNT</button>
                    </form>

                    <!-- Footer Link -->
                    <div class="auth-footer-link">
                        <span>Already have an account?</span>
                        <a href="login.html" style="font-weight: 600; color: var(--color-primary);">Sign In</a>
                    </div>

                    <!-- Developer Security Notice -->
                    <div class="demo-security-notice">
                        ℹ️ <strong>Demo Note:</strong> Credentials are stored locally in browser storage for
                        demonstration purposes only.
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Professional Footer -->
    <app-footer></app-footer>

</body>

</html>
